name: ctrl-ltv-n8n

x-n8n-environment: &n8n-environment
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: n8n-postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB}
  DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: n8n-redis
  QUEUE_BULL_REDIS_PORT: 6379
  QUEUE_BULL_REDIS_DB: 0
  QUEUE_BULL_REDIS_PASSWORD: ${N8N_REDIS_PASSWORD}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_HOST: ${N8N_DOMAIN}
  N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
  N8N_PROTOCOL: https
  WEBHOOK_URL: https://${N8N_WEBHOOK_DOMAIN}/
  N8N_PROXY_HOPS: 1
  N8N_SECURE_COOKIE: "true"
  N8N_RUNNERS_ENABLED: "true"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: 336
  GENERIC_TIMEZONE: ${N8N_TIMEZONE}
  TZ: ${N8N_TIMEZONE}
  NODE_ENV: production

x-n8n-service: &n8n-service
  image: ${N8N_IMAGE}
  restart: unless-stopped
  environment: *n8n-environment
  volumes:
    - n8n_storage:/home/node/.n8n
  depends_on:
    n8n-postgres:
      condition: service_healthy
    n8n-redis:
      condition: service_healthy
  networks:
    - default
    - n8n-internal
    - automation

services:
  n8n-postgres:
    image: ${N8N_POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_POSTGRES_DB}
      POSTGRES_USER: ${N8N_POSTGRES_USER}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_POSTGRES_USER} -d ${N8N_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - n8n-internal

  n8n-redis:
    image: ${N8N_REDIS_IMAGE}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction", "--requirepass", "${N8N_REDIS_PASSWORD}"]
    volumes:
      - n8n_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${N8N_REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - n8n-internal

  n8n-editor:
    <<: *n8n-service
    command: start
    expose:
      - "5678"

  n8n-webhook:
    <<: *n8n-service
    command: webhook
    expose:
      - "5678"

  n8n-worker:
    <<: *n8n-service
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-5}
    networks:
      - n8n-internal
      - automation

volumes:
  n8n_postgres_data:
  n8n_redis_data:
  n8n_storage:

networks:
  n8n-internal:
    internal: true
  automation:
    external: true
    name: ${AUTOMATION_NETWORK:-ctrl-ltv-automation}
