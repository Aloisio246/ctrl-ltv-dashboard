services:
  frontend:
    container_name: ctrl-ltv-frontend
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
      VITE_API_EMAIL: ${VITE_API_EMAIL:-}
      VITE_API_PASSWORD: ${VITE_API_PASSWORD:-}
    ports:
      - "8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
